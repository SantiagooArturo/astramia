<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// "Los 3 signos que siempre vuelven con su ex" — ~22 s, any date. A
// countdown (3, 2, 1) people argue about in the comments, then the turn:
// it's not your sign that decides, it's your Venus.
import { astramiaReads, chip, clamp, cta, ctx, DURATION, ease, GOLD, glow, glyph, goldLine, LEAD, lerp, line, P, planet, pops, prog, punch, shown, start } from "./kit.js";

const cuts = [0, P.n3.start - LEAD, P.n2.start - LEAD, P.n1.start - LEAD, P.signo.start - LEAD, P.astramia.start - LEAD, P.vuelven.start - LEAD, P.empieza.end + 0.25, DURATION];

function hook(t, leave) {
  const flash = 1 - ease.out(prog(t % DURATION, 0, 0.5));
  const punch = 1 + 0.08 * Math.max(0, Math.sin(Math.min((t % DURATION) / 0.5, 1) * Math.PI));
  line("LOS 3 SIGNOS", 290, { family: "Geist", size: 66, weight: 700, spacing: 14, color: GOLD, alpha: leave });
  line("que siempre vuelven", 420, { size: 112, alpha: leave, scale: punch });
  line("con su ex", 570, { size: 190, italic: true, gradient: true, glowColor: "rgba(233,196,106,0.55)", alpha: leave, scale: 1 + 0.06 * flash });
  // The three, still unnamed.
  for (const [k, symbol] of ["♉", "♋", "♏"].entries()) glyph(t, 0.28 * leave, { symbol, x: 300 + k * 240, y: 790, size: 120 });
}

/** One place in the countdown: the number, the sign, what it does. */
function place(t, l, a, { n, symbol, name, first, second, at }) {
  glyph(t, 0.16 * a, { symbol, y: 520, size: 560 });
  chip(`#${n}`, 190, a * shown(t, at.n), { size: 48 });
  const pop = clamp(pops(t, at.name));
  line(name, 360, { size: 170, gradient: true, glowColor: "rgba(233,196,106,0.5)", alpha: a * clamp(pop * 1.3), scale: lerp(0.7, 1, pop), max: 940 });
  const s = shown(t, at.first, 0.2);
  line(first, 530, { size: 90, alpha: a * s, dy: (1 - s) * 30 });
  goldLine(second, 665, pops(t, at.second), a, { size: 104 });
}

start({
  symbol: "♀",
  cuts,
  goal: 6,
  hook,
  scenes: [
    (t, l, a) => place(t, l, a, {
      n: 3, symbol: "♉", name: "TAURO", first: "No vuelve por amor.", second: "Vuelve por costumbre.",
      at: { n: P.n3.start, name: P.tauro.start, first: P.amor.start, second: P.costumbre.start },
    }),
    (t, l, a) => place(t, l, a, {
      n: 2, symbol: "♋", name: "CÁNCER", first: "Guarda todos los recuerdos", second: "y un día los vuelve a abrir",
      at: { n: P.n2.start, name: P.cancer.start, first: P.recuerdo.start, second: P.abrir.start },
    }),
    (t, l, a) => place(t, l, a, {
      n: 1, symbol: "♏", name: "ESCORPIO", first: "Dice que ya lo superó.", second: "No es cierto.",
      at: { n: P.n1.start, name: P.escorpio.start, first: P.supero.start, second: P.cierto.start },
    }),
    // The turn: the sign gets struck out, Venus takes its place.
    (t, l, a) => {
      const w = P.signo.words;
      line("Pero aquí no manda", 270, { size: 100, alpha: a, scale: punch(l) });
      const width = line("tu signo", 395, { size: 124, alpha: a * shown(t, w[4].start) });
      const strike = ease.out(prog(t, w[5].end, w[5].end + 0.25));
      if (strike > 0) {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = GOLD; ctx.shadowColor = "rgba(233,196,106,0.8)"; ctx.shadowBlur = 20;
        ctx.fillRect(540 - width / 2 - 14, 400, (width + 28) * strike, 7);
        ctx.restore();
      }
      const venus = P.manda.words[2].start;
      goldLine("Manda tu Venus", 560, pops(t, venus), a, { size: 130 });
      const v = shown(t, venus, 0.4);
      glow(540, 770, 200, "rgba(255,230,170,ALPHA)", 0.5 * a * v);
      planet("venus", 540, 770, 85 * lerp(0.6, 1, v), { alpha: a * v });
    },
    (t, l, a) => astramiaReads(t, l, a, {
      phrase: P.astramia,
      text: "Tu Venus está en Cáncer: no olvidas a quien quisiste, y cuando te escribe",
      hidden: "no sabes decirle que no.",
    }),
    (t, l, a) => {
      glyph(t, 0.1 * a);
      line("¿Tu Venus es", 280, { size: 104, alpha: a, scale: punch(l) });
      goldLine("de las que vuelven?", 420, pops(t, P.vuelven.words[6].start), a, { size: 130 });
      cta(t, l, a, { label: "Descúbrelo gratis", at: P.empieza.start, url: P.empieza.words[2].start });
    },
  ],
});
</script>
</html>
